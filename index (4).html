<!DOCTYPE html>
<!-- Site de varejo com tema único claro, como o site real da marca. Tokens escuros definidos, mas o tema claro é fixado. -->
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privacidade e seus dados | Drogasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E1001A; --wine:#B0182A; --wine-dk:#8C1121; --wine-50:#FBEDEF;
  --ink:#23252A; --ink-2:#575C66; --ink-3:#80858F;
  --line:#E5E2DD; --line-2:#EFEDEA; --sand:#F8F3EE; --gray:#F3F3F2; --bg:#FFFFFF; --card:#FFFFFF;
  --ok:#1C7A4B; --ok-bg:#E6F4EC; --warn:#8F5600; --warn-bg:#FFF3DC; --err:#B42318; --err-bg:#FDECEA; --info:#1C4E8F; --info-bg:#E8F0FB;
  --focus:#1C4E8F;
  --r-sm:8px; --r:12px; --r-lg:20px; --pill:999px;
  --shadow:0 1px 2px rgba(35,37,42,.06),0 6px 24px rgba(35,37,42,.06);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#F1F1F2; --ink-2:#C2C5CC; --ink-3:#9499A3; --line:#33363C; --line-2:#2A2D32; --sand:#2A2522; --gray:#24262A; --bg:#17181B; --card:#1E2024;
    --wine-50:#3A1A20; --ok-bg:#16301F; --warn-bg:#352A12; --err-bg:#3A1A18; --info-bg:#15263D;
  }
}
:root[data-theme="dark"]{
  --ink:#F1F1F2; --ink-2:#C2C5CC; --ink-3:#9499A3; --line:#33363C; --line-2:#2A2D32; --sand:#2A2522; --gray:#24262A; --bg:#17181B; --card:#1E2024;
  --wine-50:#3A1A20; --ok-bg:#16301F; --warn-bg:#352A12; --err-bg:#3A1A18; --info-bg:#15263D;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:18px;height:18px}.ico.lg{width:28px;height:28px}.ico.xl{width:44px;height:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line-2)}
.hdr-top{display:flex;align-items:center;gap:28px;height:76px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--red);font-weight:800;font-size:23px;letter-spacing:.2px;cursor:pointer;white-space:nowrap}
.brand-mark{width:30px;height:30px}
.search{flex:1;position:relative;max-width:420px}
.search input{width:100%;height:44px;border-radius:var(--pill);border:1px solid transparent;background:var(--gray);padding:0 46px 0 18px;font-size:15px}
.search input:focus{border-color:var(--ink-3);outline:none;background:var(--bg)}
.search>.ico{position:absolute;right:15px;top:11px;color:var(--ink-2)}
.suggest{position:absolute;left:0;min-width:min(480px,100%);width:100%;top:50px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;display:none}
.suggest.on{display:block}
.suggest .lbl{font-size:12px;color:var(--ink-3);padding:6px 10px}
.sug{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:var(--r-sm);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.sug:hover,.sug:focus-visible{background:var(--sand)}
.sug b{display:block;font-size:15px}.sug span{font-size:13px;color:var(--ink-2)}
.sug .ic{width:36px;height:36px;border-radius:10px;background:var(--wine-50);color:var(--wine);display:grid;place-items:center;flex:none}
.util{display:flex;align-items:center;gap:22px;margin-left:auto}
.ut{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;cursor:pointer;text-align:left;line-height:1.15;font-size:13px;color:var(--ink-2)}
.ut .ico{color:var(--red)}
.ut b{display:block;color:var(--ink);font-weight:700;font-size:13px}
.ut.privacy{border:1.5px solid var(--line);border-radius:var(--pill);padding:7px 14px 7px 10px}
.ut.privacy:hover{border-color:var(--wine)}
.nav{display:flex;align-items:center;gap:26px;height:52px;font-size:14px;color:var(--ink-2);overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;color:inherit;display:flex;gap:6px;align-items:center}
.nav .strong{color:var(--ink);font-weight:700}
.nav .cta{margin-left:auto;background:var(--wine);color:#fff;font-weight:700;padding:10px 18px;border-radius:var(--pill)}
.burger{display:none}

/* Generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:var(--pill);font-weight:700;font-size:15px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--wine);color:#fff}.btn-p:hover{background:var(--wine-dk)}
.btn-s{background:var(--bg);border-color:var(--ink-3);color:var(--ink)}.btn-s:hover{border-color:var(--ink)}
.btn-g{background:none;color:var(--wine);padding:0 6px;height:auto}
.btn-g:hover{text-decoration:underline}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.link{color:var(--wine);font-weight:700;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer}
.crumb{font-size:13px;color:var(--ink-2);padding:14px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:inherit;cursor:pointer}
.crumb b{color:var(--ink)}
.crumbbar{background:var(--gray)}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.5px}
h2{font-size:26px;font-weight:800;letter-spacing:-.3px}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}.xs{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:var(--pill);background:var(--gray);color:var(--ink-2);white-space:nowrap}
.chip .ico{width:15px;height:15px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:var(--pill);white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-err{background:var(--err-bg);color:var(--err)}.b-info{background:var(--info-bg);color:var(--info)}.b-mute{background:var(--gray);color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.note{display:flex;gap:12px;padding:16px 18px;border-radius:var(--r);font-size:15px;align-items:flex-start}
.note .ico{margin-top:1px}
.n-info{background:var(--info-bg);color:var(--ink)}.n-info .ico{color:var(--info)}
.n-warn{background:var(--warn-bg)}.n-warn .ico{color:var(--warn)}
.n-err{background:var(--err-bg)}.n-err .ico{color:var(--err)}
.n-ok{background:var(--ok-bg)}.n-ok .ico{color:var(--ok)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack>*+*{margin-top:12px}
.sec{padding-top:48px;padding-bottom:48px}
.hr{height:1px;background:var(--line);margin:24px 0;border:0}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field>label,.legend{font-weight:700;font-size:15px}
.field>label.check{font-weight:400}
.field .hint{font-size:13.5px;color:var(--ink-2)}
.inp{height:50px;border-radius:var(--r-sm);border:1.5px solid var(--ink-3);padding:0 14px;background:var(--bg);font-size:16px;width:100%}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(28,78,143,.18)}
.field.bad .inp{border-color:var(--err);background:var(--err-bg)}
.errmsg{display:none;gap:6px;align-items:flex-start;color:var(--err);font-size:14px;font-weight:600}
.field.bad .errmsg{display:flex}
.errmsg .ico{width:17px;height:17px;margin-top:2px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin-top:3px;width:20px;height:20px;accent-color:var(--wine);flex:none}
.opt.on{border-color:var(--wine);background:var(--wine-50)}
.opt b{display:block}.opt span{font-size:14px;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--gray);border-radius:var(--pill);padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px 18px;border-radius:var(--pill);cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--wine);margin-top:2px;flex:none}
.code{display:flex;gap:10px}
.code input{width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;border-radius:var(--r-sm);border:1.5px solid var(--ink-3);background:var(--bg)}
.code.bad input{border-color:var(--err);background:var(--err-bg)}
.code input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(28,78,143,.18)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--ink-3);border-radius:var(--pill);transition:.2s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{left:25px}
.switch input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}

/* Home */
.cats{display:grid;grid-template-columns:repeat(10,1fr);gap:12px;padding:20px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;text-align:center;background:none;border:0;cursor:pointer;color:var(--ink)}
.cat i{width:76px;height:56px;border-radius:14px;background:var(--sand);display:grid;place-items:center;color:var(--wine)}
.hero{border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(110deg,#FDEBEA 0%,#FFF6F1 55%,#FDE3E0 100%);display:grid;grid-template-columns:1.1fr 1fr;align-items:center;min-height:260px;position:relative}
.hero h2{font-size:clamp(28px,3.6vw,44px);color:#5B1420;font-weight:800;line-height:1.05}
.hero .txt{padding:36px 48px}
.hero .txt p{margin:12px 0 20px;color:#6E3B43;font-size:17px}
.dots{display:flex;gap:6px;justify-content:center;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink-2)}
.perks{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:12px 0 8px}
.perk{display:flex;gap:12px;align-items:center;background:var(--gray);border-radius:var(--r);padding:16px;font-size:14px}
.perk i{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--ink)}
.prods{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.prod{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.prod .ph{height:130px;border-radius:10px;background:var(--gray);display:grid;place-items:center}
.prod .nm{font-size:14px;font-weight:600;min-height:42px}
.prod .off{align-self:flex-start;background:var(--ok);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.prod .pr{font-size:20px;font-weight:800}.prod .old{font-size:13px;color:var(--ink-3);text-decoration:line-through}

/* Footer */
.ftr{background:var(--gray);margin-top:56px;padding:28px 0 40px}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.fcard{background:var(--card);border-radius:var(--r-lg);padding:22px;display:flex;gap:14px;align-items:center;cursor:pointer;border:1.5px solid transparent;text-align:left}
.fcard:hover{border-color:var(--line)}
.fcard b{display:block}.fcard span{font-size:14px;color:var(--ink-2)}
.fcard .ico.chev{margin-left:auto;color:var(--ink-2)}
.fcard.priv{border-color:var(--wine-50);background:linear-gradient(0deg,var(--wine-50),var(--wine-50))}
.fcard.priv .ic{color:var(--wine)}
.fcols{background:var(--card);border-radius:var(--r-lg);padding:28px;display:grid;grid-template-columns:repeat(5,1fr);gap:20px;font-size:14px}
.fcols h4{margin:0 0 10px;font-size:15px}
.fcols button{display:block;background:none;border:0;padding:3px 0;cursor:pointer;color:var(--ink-2);text-align:left}
.fcols button:hover{color:var(--ink);text-decoration:underline}
.fcols .privcol{background:var(--wine-50);margin:-12px;padding:12px;border-radius:var(--r)}
.fcols .privcol h4{color:var(--wine);display:flex;gap:6px;align-items:center}
.fbottom{font-size:12.5px;color:var(--ink-2);padding:18px 4px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* Cookie banner */
.cookie{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;max-width:980px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 10px 40px rgba(0,0,0,.18);padding:22px 24px;display:flex;gap:24px;align-items:center}
.cookie p{font-size:14.5px;color:var(--ink-2)}
.cookie .acts{display:flex;gap:10px;flex-wrap:wrap}
.cookie .acts .btn{min-width:150px}

/* Portal */
.psub{background:var(--bg);border-bottom:1px solid var(--line)}
.psub .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.psub button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:15px}
.psub button.on{color:var(--ink);border-bottom-color:var(--wine)}
.phero{background:var(--sand);padding:44px 0 48px}
.phero .wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:40px;align-items:start}
.phero .lead{font-size:19px;color:var(--ink-2);margin:14px 0 22px;max-width:600px}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.facts .chip{background:var(--bg);color:var(--ink);padding:8px 14px;font-size:14px}
.facts .chip .ico{color:var(--ok)}
.track{background:var(--card);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.rights h3{font-size:17px}
.rgroup{margin-top:28px}
.rgroup>h3{font-size:15px;color:var(--ink-2);font-weight:700;margin-bottom:12px}
.right{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px;cursor:pointer;min-height:100%}
.right:hover{border-color:var(--wine);box-shadow:var(--shadow)}
.right .top{display:flex;gap:12px;align-items:flex-start}
.right .ic{width:44px;height:44px;border-radius:12px;background:var(--wine-50);color:var(--wine);display:grid;place-items:center;flex:none}
.right b{font-size:17px;line-height:1.25}
.right p{font-size:14.5px;color:var(--ink-2)}
.right .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px;align-items:center}
.right .law{font-size:12.5px;color:var(--ink-3)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.st4{position:relative;padding:20px;border-radius:var(--r-lg);background:var(--gray)}
.st4::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--wine);color:#fff;font-weight:800;margin-bottom:12px}
.st4 p{font-size:14.5px;color:var(--ink-2);margin-top:4px}
.dpo{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.dpo .av{width:56px;height:56px;border-radius:50%;background:var(--wine-50);color:var(--wine);display:grid;place-items:center}

/* Flow */
.flow{max-width:760px;margin:0 auto;padding:28px 24px 64px}
.stepper{display:flex;gap:8px;margin:8px 0 28px;list-style:none;padding:0}
.stepper li{flex:1;font-size:13px;font-weight:600;color:var(--ink-3)}
.stepper li i{display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:8px}
.stepper li.done i,.stepper li.cur i{background:var(--wine)}
.stepper li.cur{color:var(--ink)}
.back{display:inline-flex;gap:6px;align-items:center;background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;font-weight:600;margin-bottom:12px}
.flow h1{font-size:32px}
.flow .lead{font-size:17.5px;color:var(--ink-2);margin:10px 0 24px}
.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:28px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lst{list-style:none;padding:0;margin:10px 0 0}
.lst li{display:flex;gap:10px;padding:7px 0;font-size:15px;align-items:flex-start}
.lst .ico{width:19px;height:19px;margin-top:2px}
.lst.ok .ico{color:var(--ok)}.lst.keep .ico{color:var(--warn)}
.sumrow{display:grid;grid-template-columns:200px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.sumrow:last-child{border-bottom:0}
.sumrow dt{font-weight:700;font-size:15px}
.sumrow dd{margin:0;color:var(--ink-2)}
.proto{font-size:30px;font-weight:800;letter-spacing:.5px;color:var(--ink)}
.successic{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:18px}

/* Requests */
.req{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);cursor:pointer;text-align:left;width:100%}
.req:hover{border-color:var(--ink-3)}
.req .ic{width:44px;height:44px;border-radius:12px;background:var(--gray);display:grid;place-items:center}
.req b{display:block;font-size:16px}
.req.hl{border-color:var(--wine);box-shadow:0 0 0 3px var(--wine-50)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:28px 1fr;gap:14px;position:relative;padding-bottom:22px}
.timeline li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gray);color:var(--ink-3)}
.timeline .dot .ico{width:16px;height:16px}
.timeline li.done .dot{background:var(--ok);color:#fff}
.timeline li.now .dot{background:var(--wine);color:#fff}
.timeline li.late .dot{background:var(--err);color:#fff}
.timeline b{display:block;font-size:15px}.timeline span{font-size:14px;color:var(--ink-2)}
.timeline li.todo b{color:var(--ink-3)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.bar.late i{background:var(--err)}
.detail{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.upl{border:2px dashed var(--ink-3);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;background:var(--bg)}
.upl:hover{border-color:var(--wine)}
.file{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-sm);background:var(--gray);font-size:14px}

/* Report */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:13px;color:var(--ink-2);font-weight:700;padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.tblw .tbl tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 18px;font-size:15px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:600}
.repsec{scroll-margin-top:140px}
.toc{position:sticky;top:150px}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--line);padding:8px 14px;cursor:pointer;color:var(--ink-2);font-weight:600}
.toc button:hover{border-left-color:var(--wine);color:var(--ink)}

/* Account */
.acct{display:grid;grid-template-columns:240px 1fr;gap:32px;padding:28px 0}
.side button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:12px 14px;border-radius:var(--r);cursor:pointer;color:var(--ink);font-size:15px;text-align:left}
.side button:hover{background:var(--gray)}
.side button.on{background:var(--wine-50);color:var(--wine);font-weight:700}
.cons{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
.cons h3{padding:18px 22px;background:var(--gray);font-size:16px}
.crow{display:grid;grid-template-columns:1fr auto;gap:18px;padding:18px 22px;border-top:1px solid var(--line);align-items:start}
.crow b{display:block;font-size:15.5px}
.crow p{font-size:14px;color:var(--ink-2);margin-top:4px}
.crow.sens{background:var(--warn-bg)}
.more{margin-top:8px}
.more summary{cursor:pointer;font-weight:700;color:var(--wine);font-size:14px}
.more div{font-size:14px;color:var(--ink-2);padding-top:8px}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--card);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.15);padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overflow:auto}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qitem{background:var(--gray);border:0;border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:14px}
.qitem .ico{color:var(--red)}
.qitem.priv{background:var(--wine-50);grid-column:span 2;flex-direction:row;align-items:center}

/* FAQ */
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:16px 0;font-weight:700;font-size:16.5px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:.2s}
.faq details[open] summary .ico{transform:rotate(180deg)}
.faq details p{padding:0 0 18px;color:var(--ink-2);max-width:720px}

/* Modal & toast */
.ov{position:fixed;inset:0;background:rgba(20,20,24,.5);z-index:70;display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border-radius:var(--r-lg);padding:28px;max-width:560px;width:100%;max-height:calc(100% - 40px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;background:#23252A;color:#fff;padding:14px 20px;border-radius:var(--r);display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease}
.toast .ico{color:#7BD7A4}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Roteiro (guia do avaliador) */
.guide-btn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--ink);color:var(--bg);border:0;border-radius:var(--pill);padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.guide{position:fixed;left:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:46;width:min(340px,calc(100% - 32px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 10px 40px rgba(0,0,0,.2);padding:18px}
.guide h4{margin:0 0 4px;font-size:15px}
.guide p{font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.guide button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px}
.guide button:hover{background:var(--gray)}
.guide .gh{font-size:12px;color:var(--ink-3);font-weight:700;margin:10px 0 2px 10px}

/* Responsive */
@media (max-width:1000px){
  .cats{grid-template-columns:repeat(5,1fr)}
  .perks,.prods{grid-template-columns:repeat(3,1fr)}
  .fcols{grid-template-columns:repeat(2,1fr)}
  .phero .wrap,.detail{grid-template-columns:1fr}
  .steps4{grid-template-columns:repeat(2,1fr)}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ut.hide-md{display:none}
  .toc{display:none}
}
@media (max-width:720px){
  .wrap{padding:0 16px}
  .hdr-top{height:auto;flex-wrap:wrap;gap:8px;padding:10px 0}
  .brand{font-size:20px}.brand-mark{width:26px;height:26px}
  .ut.privacy{padding:6px 10px 6px 8px}
  .search{order:3;flex-basis:100%;max-width:none}
  .util{gap:2px}
  .ut b,.ut span.t{display:none}
  .ut.privacy b{display:block}
  .nav{display:none}
  .burger{display:block}
  .hero{grid-template-columns:1fr}.hero .art{display:none}.hero .txt{padding:28px}
  .perks,.prods{grid-template-columns:repeat(2,1fr)}
  .fcards,.fcols,.g2,.g3,.g4,.two,.steps4{grid-template-columns:1fr}
  .cookie{flex-direction:column;align-items:stretch}
  .cookie .acts .btn{flex:1}
  .sumrow{grid-template-columns:1fr auto}.sumrow dd{grid-column:1/-1;grid-row:2}
  .req{grid-template-columns:auto 1fr}.req .badge,.req .chev{grid-column:2}
  .acct{grid-template-columns:1fr}.side{display:none}
  .kv{grid-template-columns:1fr}
  .dpo{grid-template-columns:auto 1fr}.dpo .btn{grid-column:1/-1}
  .code input{width:44px;height:54px}
  .flow h1{font-size:27px}
}

a.right,a.req,a.sug,a.ut,a.btn,.crumb a,a.back,a.privband,a.flink{text-decoration:none;color:inherit}
a.brand{text-decoration:none;color:var(--red)}a.btn-p{color:#fff}a.btn-g{color:var(--wine)}.crumb a:hover,a.flink:hover{text-decoration:underline}
a.flink{display:block;padding:3px 0;color:var(--ink-2);font-size:14px}
.privband{display:flex;gap:16px;align-items:center;margin:20px 0 0;padding:22px 24px;border-radius:var(--r-lg);background:var(--wine-50);border:1.5px solid transparent}
.privband:hover{border-color:var(--wine)}
.privband .ic{color:var(--wine)}.privband b{display:block;font-size:18px}.privband span span{color:var(--ink-2);font-size:15px}
.privband>.ico{margin-left:auto;color:var(--wine)}
.guide .link{display:inline;width:auto}
[data-go]{cursor:pointer}
.prod .badge{align-self:flex-start}
@media print{.hdr,.ftr,.crumbbar,.guide-btn,.guide,.back,.btn{display:none!important}}

/* ===== Rotas ===== */
function render(){const seg=ROUTE.slice(1).split('/').filter(Boolean);let html;
 if(seg[0]==='meus-pedidos')html=vCompras();
 else if(seg[0]==='conta')html=vConta();
 else if(seg[0]==='conta-excluida')html=vExcluida();
 else if(seg[0]!=='privacidade')html=vHome();
 else if(!seg[1])html=vPortal();
 else if(seg[1]==='pedido')html=vPedido(seg[2]);
 else if(seg[1]==='identidade')html=vIdentidade();
 else if(seg[1]==='enviado')html=vEnviado();
 else if(seg[1]==='solicitacoes')html=seg[3]==='relatorio'?vRelatorio(seg[2]):seg[2]?vDet(seg[2]):vLista();
 else html=vPortal();
 if(!html)return;
 closeModal();$('#app').innerHTML=html;window.scrollTo(0,0);wire()}
function wire(){
 const cpf=$('#cpf');cpf&&cpf.addEventListener('input',e=>{e.target.value=maskCpf(e.target.value);setBad('f-cpf',false)});
 const all=[...document.querySelectorAll('.code input')];
 all.forEach((el,i)=>{el.addEventListener('input',()=>{$('#code').classList.remove('bad');setBad('f-code',false);el.value=dig(el.value).slice(0,1);if(el.value&&all[i+1])all[i+1].focus()});
  el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&all[i-1])all[i-1].focus()})});
 all[0]&&all[0].focus();
 const f=$('#file');f&&f.addEventListener('change',()=>{if(f.files[0]){S.arquivo=f.files[0].name;render()}});
}

/* ===== Ações ===== */
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-go]');if(l){e.preventDefault();closeModal();go(l.dataset.go);return}
 const a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a,e)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='ack'&&t.checked)setBad('f-ack',false);
 if(t.dataset.cons){S.cons[t.dataset.cons]=t.checked;toast(t.checked?'Autorização dada.':'Autorização retirada.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-go]'))go(e.target.dataset.go);if(e.key==='Enter'&&e.target.matches&&e.target.matches('a[data-act]')){e.preventDefault();e.target.click()}});
window.addEventListener('popstate',()=>{ROUTE=location.hash||'#/';render()});
function novaSolicitacao(r){const id='DRG-2026-'+String(S.next++).padStart(6,'0');S.sol.unshift({id,r,status:'analise',aberto:HOJE,prazo:PRAZO_NOVO});S.last=id;go('#/privacidade/enviado')}
function act(n,el,e){switch(n){
 case 'closeov': if(e.target===el)closeModal();break;
 case 'close': closeModal();break;
 case 'ck': S.cookie=true;render();if(el.dataset.v)toast(el.dataset.v);break;
 case 'ckopen': S.cookie=false;go('#/');break;
 case 'continuar': if(S.r==='exclusao'&&!$('#ack').checked){setBad('f-ack',true);return}go('#/privacidade/identidade');break;
 case 'sendcode': {const c=dig($('#cpf').value);if(c.length!==11){setBad('f-cpf',true,c.length?`O CPF tem 11 números. Faltam ${11-c.length}.`:'Digite seu CPF com os 11 números.');return}S.sent=true;render();break}
 case 'enviar': {const code=[...document.querySelectorAll('.code input')].map(x=>x.value).join('');
  if(code.length<6){$('#code').classList.add('bad');setBad('f-code',true,`Digite os 6 números do código. Faltam ${6-code.length}.`);return}
  novaSolicitacao(S.r);break}
 case 'cancelar': modal(`<h2>Cancelar esta solicitação?</h2><div class="acts"><button class="btn btn-s" data-act="close">Manter</button><button class="btn btn-p" data-act="docancel" data-id="${el.dataset.id}">Cancelar solicitação</button></div>`);break;
 case 'docancel': {const p=S.sol.find(x=>x.id===el.dataset.id);p.status='cancelado';p.fim=HOJE;render();break}
 case 'enviardoc': {if(!S.arquivo){setBad('f-file',true);return}const p=S.sol.find(x=>x.id===el.dataset.id);p.status='analise';S.arquivo=null;render();toast('Documento enviado.');break}
 case 'excluirconta': modal(`<h2>Excluir sua conta?</h2><p class="muted">Notas fiscais e receitas ficam guardadas por lei.</p>
  <div class="acts"><button class="btn btn-s" data-act="close">Cancelar</button><button class="btn btn-p" style="background:var(--err)" data-act="confirmaexclusao">Excluir</button></div>`);break;
 case 'confirmaexclusao': closeModal();go('#/conta-excluida');break;
}}
render();

</script>
</body>
</html>
